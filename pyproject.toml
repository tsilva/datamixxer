[project]
name = "datamixxer"
version = "0.1.0"
description = "Config-driven balanced subsampling and mixing for Hugging Face datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.14.3",
  "datasets>=5.0.1",
  "huggingface_hub>=0.26.0",
  "idna>=3.15",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.9.0,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.16.1",
]

[project.scripts]
datamixxer = "datamixxer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datamixxer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
