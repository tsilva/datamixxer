name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache: true
      - name: Install the locked dependency graph
        run: uv sync --config-file uv.toml --frozen --all-extras
      - name: Validate the portable lock
        run: uv lock --config-file uv.toml --check
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test security boundaries and application behavior
        run: uv run --frozen pytest -q
      - name: Audit the locked environment
        run: uv run --frozen pip-audit
      - name: Import and CLI smoke tests
        run: |
          uv run --frozen python -c "import aiohttp, datasets, datamixxer, huggingface_hub, idna"
          uv run --frozen datamixxer --help >/dev/null
          uv run --frozen python -m compileall -q src tests
      - name: Build package
        run: uv build
