name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache: true
      - name: Install the locked dependency graph
        run: uv sync --config-file uv.toml --frozen --all-extras
      - name: Validate the portable lock
        run: uv lock --config-file uv.toml --check
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Test security boundaries and application behavior
        run: uv run --frozen pytest -q
      - name: Audit the locked environment
        run: uv run --frozen pip-audit
      - name: Import and CLI smoke tests
        run: |
          uv run --frozen python -c "import aiohttp, datasets, datamixxer, huggingface_hub, idna"
          uv run --frozen datamixxer --help >/dev/null
          uv run --frozen python -m compileall -q src tests
      - name: Build package
        run: uv build
